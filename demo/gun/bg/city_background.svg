<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 城市天空渐变 -->
    <linearGradient id="cityGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2C3E50;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#34495E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A252F;stop-opacity:1" />
    </linearGradient>

    <!-- 建筑物纹理 -->
    <pattern id="buildingTexture" patternUnits="userSpaceOnUse" width="20" height="20">
      <rect width="20" height="20" fill="#2C3E50"/>
      <rect x="2" y="2" width="4" height="4" fill="#F39C12" opacity="0.8"/>
      <rect x="8" y="6" width="4" height="4" fill="#E74C3C" opacity="0.6"/>
      <rect x="14" y="10" width="4" height="4" fill="#3498DB" opacity="0.7"/>
    </pattern>
  </defs>

  <!-- 天空背景 -->
  <rect width="1200" height="600" fill="url(#cityGradient)"/>

  <!-- 地面 -->
  <rect y="600" width="1200" height="200" fill="#34495E"/>

  <!-- 远景建筑群 -->
  <rect x="0" y="400" width="80" height="200" fill="#1A252F" opacity="0.8"/>
  <rect x="100" y="350" width="60" height="250" fill="#2C3E50" opacity="0.7"/>
  <rect x="180" y="380" width="90" height="220" fill="#1A252F" opacity="0.8"/>
  <rect x="290" y="320" width="70" height="280" fill="#2C3E50" opacity="0.7"/>
  <rect x="380" y="360" width="100" height="240" fill="#1A252F" opacity="0.8"/>

  <!-- 中景建筑 -->
  <rect x="500" y="300" width="120" height="300" fill="url(#buildingTexture)"/>
  <rect x="650" y="250" width="100" height="350" fill="#34495E"/>
  <rect x="780" y="280" width="80" height="320" fill="url(#buildingTexture)"/>
  <rect x="880" y="200" width="150" height="400" fill="#2C3E50"/>
  <rect x="1050" y="320" width="90" height="280" fill="#34495E"/>

  <!-- 建筑细节 - 窗户 -->
  <g opacity="0.8">
    <!-- 第一栋建筑的窗户 -->
    <rect x="520" y="320" width="8" height="8" fill="#F39C12"/>
    <rect x="540" y="320" width="8" height="8" fill="#E74C3C"/>
    <rect x="560" y="320" width="8" height="8" fill="#3498DB"/>
    <rect x="580" y="320" width="8" height="8" fill="#F39C12"/>

    <rect x="520" y="350" width="8" height="8" fill="#3498DB"/>
    <rect x="540" y="350" width="8" height="8" fill="#F39C12"/>
    <rect x="560" y="350" width="8" height="8" fill="#E74C3C"/>
    <rect x="580" y="350" width="8" height="8" fill="#3498DB"/>
  </g>

  <!-- 月亮 -->
  <circle cx="200" cy="100" r="30" fill="#F4F4F4" opacity="0.9"/>
  <circle cx="195" cy="95" r="25" fill="#E8E8E8" opacity="0.7"/>

  <!-- 星星 -->
  <circle cx="300" cy="80" r="2" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="450" cy="60" r="1.5" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="600" cy="90" r="2" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="800" cy="70" r="1" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="950" cy="50" r="1.5" fill="#FFFFFF" opacity="0.9"/>
</svg>